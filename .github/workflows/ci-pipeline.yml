# .github/workflows/ci-pipeline.yml

name: Enterprise FinOps Auto-Recon CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  static-analysis-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11" # Targeting a stable enterprise version
        cache: 'pip'           # Speeds up CI runs by caching dependencies

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Linting (Code Quality Check)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Compilation Dry-Run
      run: |
        # Ensure all core engine scripts can compile without runtime syntax errors
        python -m py_compile src/mock_trading/engine.py
        python -m py_compile src/recon_processor/consumer.py
        python -m py_compile src/ai_agent/finops_agent.py
        echo " CI Build & Compilation Successful!"
